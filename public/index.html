<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ISEG · Captura de Incidencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
  :root{
    --bg:#12161d;
    --surface:#1a212b;
    --surface-2:#212a36;
    --border:#2b3542;
    --text:#e9edf2;
    --text-dim:#8d99a8;
    --amber:#e8a33d;
    --amber-dim:#5c4726;
    --blue:#4c8dff;
    --green:#49b47d;
    --red:#e2574c;
    --mono:'IBM Plex Mono', monospace;
    --sans:'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  ::selection{background:var(--amber);color:#12161d;}

  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh;}
  @media (max-width:900px){.app{grid-template-columns:1fr;}}

  /* ---------- Rail ---------- */
  .rail{background:var(--surface);border-right:1px solid var(--border);padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  @media (max-width:900px){.rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);}}
  .brand{padding:0 24px 24px;border-bottom:1px solid var(--border);margin-bottom:8px;}
  .brand .mark{font-family:var(--mono);font-weight:600;letter-spacing:.14em;color:var(--amber);font-size:13px;}
  .brand .title{font-size:17px;font-weight:600;margin-top:6px;}
  .brand .folio{font-family:var(--mono);color:var(--text-dim);font-size:12px;margin-top:4px;min-height:16px;}

  .steps{list-style:none;margin:0;padding:8px 0;}
  .step{display:flex;align-items:center;gap:12px;padding:11px 24px;cursor:pointer;border-left:2px solid transparent;color:var(--text-dim);font-size:13.5px;transition:background .15s;}
  .step:hover{background:var(--surface-2);}
  .step.active{border-left-color:var(--amber);background:var(--surface-2);color:var(--text);}
  .step .num{font-family:var(--mono);font-size:11px;color:var(--text-dim);width:18px;}
  .step.active .num{color:var(--amber);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--border);margin-left:auto;flex:none;}
  .dot.partial{background:var(--amber);}
  .dot.done{background:var(--green);}

  /* ---------- Main ---------- */
  main{padding:40px 48px 120px;max-width:820px;}
  @media (max-width:600px){main{padding:24px 20px 100px;}}
  .panel{display:none;}
  .panel.active{display:block;animation:rise .25s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .eyebrow{font-family:var(--mono);color:var(--amber);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
  h1{font-size:26px;margin:6px 0 4px;}
  .sub{color:var(--text-dim);font-size:14.5px;margin:0 0 32px;max-width:60ch;line-height:1.5;}

  .field{margin-bottom:22px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .hint{font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.4;}
  input[type=text],input[type=datetime-local],input[type=date],input[type=number],textarea,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:11px 13px;border-radius:8px;font-family:var(--sans);font-size:14px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  textarea{resize:vertical;min-height:90px;line-height:1.5;}
  input:focus,textarea:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,.15);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media (max-width:600px){.row2,.row3{grid-template-columns:1fr;}}

  fieldset{border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin:0 0 16px;}
  fieldset legend{font-family:var(--mono);font-size:11.5px;color:var(--amber);letter-spacing:.06em;padding:0 6px;}
  .check{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13.5px;}
  .check input{width:auto;accent-color:var(--amber);}

  .repeat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;position:relative;}
  .repeat-remove{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;}
  .repeat-remove:hover{color:var(--red);}
  .add-btn{background:var(--surface-2);border:1px dashed var(--border);color:var(--text-dim);padding:10px 14px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;}
  .add-btn:hover{color:var(--amber);border-color:var(--amber);}

  .crono-row{display:grid;grid-template-columns:110px 1fr 32px;gap:10px;align-items:start;margin-bottom:8px;}

  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:36px;padding-top:24px;border-top:1px solid var(--border);}
  .btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 20px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;transition:all .15s;}
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1204;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* review */
  .review-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
  .review-block h3{margin:0 0 10px;font-size:13px;color:var(--amber);font-family:var(--mono);letter-spacing:.05em;}
  .review-block dl{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;margin:0;font-size:13.5px;}
  .review-block dt{color:var(--text-dim);}
  .review-block dd{margin:0;white-space:pre-wrap;}

  .badge{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:5px;letter-spacing:.05em;}
  .badge.ALTA{background:rgba(226,87,76,.18);color:#f08a82;}
  .badge.MEDIA{background:rgba(232,163,61,.18);color:var(--amber);}
  .badge.BAJA{background:rgba(73,180,125,.18);color:var(--green);}
  .badge.CRÍTICA{background:#e2574c;color:#fff;}

  /* loading */
  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;gap:18px;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--amber);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{color:var(--text-dim);font-family:var(--mono);font-size:13px;}

  .error-box{background:rgba(226,87,76,.1);border:1px solid rgba(226,87,76,.4);color:#f2a49d;padding:14px 16px;border-radius:8px;font-size:13.5px;margin-bottom:20px;}

  /* report doc */
  .doc{background:#fff;color:#1a1a1a;border-radius:10px;padding:44px 48px;font-family:'IBM Plex Sans',sans-serif;}
  .doc .kicker{font-family:var(--mono);font-size:11px;color:#8a6d2f;letter-spacing:.08em;}
  .doc h2{font-size:22px;margin:4px 0 2px;}
  .doc .meta{color:#555;font-size:12.5px;margin-bottom:20px;}
  .doc h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:#111;border-bottom:2px solid #111;padding-bottom:6px;margin:28px 0 12px;}
  .doc p{line-height:1.6;font-size:13.8px;margin:0 0 10px;}
  .doc table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;}
  .doc th,.doc td{border:1px solid #ddd;padding:7px 9px;text-align:left;vertical-align:top;}
  .doc th{background:#f2f2f2;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  .doc ul{padding-left:20px;font-size:13.8px;line-height:1.6;}
  .doc .warn{background:#fff6e5;border:1px solid #e8c37a;padding:10px 12px;border-radius:6px;font-size:12.5px;color:#6b4f10;margin:14px 0;}

  .download-bar{display:flex;gap:12px;margin:22px 0 8px;flex-wrap:wrap;}

  @media print{
    .rail,.nav,.download-bar,.no-print{display:none !important;}
    .app{display:block;}
    main{padding:0;max-width:none;}
    body{background:#fff;}
    .doc{padding:0;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ================= RAIL ================= -->
  <nav class="rail">
    <div class="brand">
      <div class="mark">ISEG CORP</div>
      <div class="title">Captura de Incidencia</div>
      <div class="folio" id="railFolio"></div>
    </div>
    <ul class="steps" id="stepsList"></ul>
  </nav>

  <!-- ================= MAIN ================= -->
  <main id="main"></main>
</div>

<script>
/* ============================================================
   MODELO DE DATOS — refleja 1:1 la estructura del Excel de captura
   ============================================================ */
const state = {
  general: {
    folio:"", fechaHoraIncidente:"", fechaHoraReporte:"", pais:"Perú", ciudad:"",
    sede:"", cliente:"", area:"", reportadoPor:"", contactoReportante:"", estado:"En investigación"
  },
  clasificacion: {
    "A. Pérdidas y fraude": ["Hurto externo","Hurto interno","Robo organizado (ORC)","Robo con violencia","Fraude / colusión","Merma desconocida"],
    "B. Seguridad física": ["Intrusión / acceso no autorizado","Vandalismo","Agresión a persona","Amenaza / extorsión","Portación de arma / artefacto","Disturbio / manifestación"],
    "C. Personas": ["Accidente laboral","Emergencia médica","Conducta indebida","Persona extraviada"],
    "D. Activos y tecnología": ["Falla de CCTV","Falla de alarma / sistema","Sabotaje","Pérdida / daño de activo","Incidente cibernético"],
    "E. Operacional": ["Incumplimiento de protocolo","Falla de proveedor","Incidente vehicular","Otro (detallar en hechos)"]
  },
  clasificacionSel: {},
  severidad: { nivel:"", dimension:"", justificacion:"" },
  hechos: { descripcion:"", cronologia:[{hora:"",evento:""}], deteccion:"" },
  impacto: { moneda:"PEN", valorActivos:"", valorRecuperado:"", danosInfra:"", baseCalculo:"" },
  notificaciones: { policia:"No", fiscalia:"No", aseguradora:"No", cliente:"No", gerenciaISEG:"No", numDenuncia:"", comisaria:"", fechaDenuncia:"" },
  acciones: { tomadas:"", analisisPreliminar:"", controlesFallaron:"" },
  personas: [],
  evidencias: [],
  planAccion: []
};

const MATRIZ = [
  ["BAJA","Sin lesiones a personas.","Pérdida marginal, absorbible por la operación.","Sin interrupción; se resuelve con recursos del turno.","Sin exposición externa."],
  ["MEDIA","Primeros auxilios en sitio, sin descanso médico.","Pérdida perceptible que exige reposición, sin comprometer el período.","Interrupción parcial; se restablece el mismo día.","Conocimiento interno del cliente, sin exposición pública."],
  ["ALTA","Lesión que requiere atención médica externa o descanso médico.","Pérdida significativa que afecta resultados o activa reclamo a aseguradora.","Interrupción de la sede por horas o cierre parcial.","Reclamo formal, denuncia policial/fiscal, o riesgo de difusión externa."],
  ["CRÍTICA","Lesión grave, hospitalización o riesgo de vida.","Pérdida mayor que compromete el contrato.","Cierre total de la sede o suspensión del servicio.","Exposición pública/prensa, proceso legal, o riesgo de pérdida del contrato."]
];

let report = null; // resultado generado por la API

/* ============================================================
   DEFINICIÓN DE PASOS
   ============================================================ */
const STEPS = [
  {id:"general", label:"Datos generales", render:renderGeneral},
  {id:"clasificacion", label:"Clasificación", render:renderClasificacion},
  {id:"severidad", label:"Severidad", render:renderSeveridad},
  {id:"hechos", label:"Hechos", render:renderHechos},
  {id:"impacto", label:"Impacto económico", render:renderImpacto},
  {id:"notificaciones", label:"Notificaciones", render:renderNotificaciones},
  {id:"acciones", label:"Acciones y análisis", render:renderAcciones},
  {id:"personas", label:"Personas involucradas", render:renderPersonas},
  {id:"evidencias", label:"Evidencias", render:renderEvidencias},
  {id:"plan", label:"Plan de acción", render:renderPlan},
  {id:"revision", label:"Revisión y generación", render:renderRevision},
];
let current = 0;

/* ============================================================
   RAIL
   ============================================================ */
function stepStatus(i){
  // muy simple: "done" si el paso tiene contenido mínimo, si no "empty"
  const id = STEPS[i].id;
  const has = (v)=> v && String(v).trim().length>0;
  switch(id){
    case "general": return has(state.general.folio) && has(state.general.sede) ? "done":"empty";
    case "clasificacion": return Object.values(state.clasificacionSel).some(Boolean) ? "done":"empty";
    case "severidad": return has(state.severidad.nivel) && has(state.severidad.justificacion) ? "done":"empty";
    case "hechos": return has(state.hechos.descripcion) ? "done":"empty";
    case "impacto": return has(state.impacto.valorActivos) ? "done":"empty";
    case "notificaciones": return "partial";
    case "acciones": return has(state.acciones.analisisPreliminar) ? "done":"empty";
    case "personas": return state.personas.length ? "done":"empty";
    case "evidencias": return state.evidencias.length ? "done":"empty";
    case "plan": return state.planAccion.length ? "done":"empty";
    case "revision": return report ? "done":"empty";
  }
  return "empty";
}

function renderRail(){
  const list = document.getElementById("stepsList");
  list.innerHTML = "";
  STEPS.forEach((s,i)=>{
    const li = document.createElement("li");
    li.className = "step" + (i===current?" active":"");
    const st = stepStatus(i);
    li.innerHTML = `<span class="num">${String(i+1).padStart(2,"0")}</span><span>${s.label}</span><span class="dot ${st==='done'?'done':st==='partial'?'partial':''}"></span>`;
    li.onclick = ()=>{ current = i; renderAll(); };
    list.appendChild(li);
  });
  document.getElementById("railFolio").textContent = state.general.folio ? "FOLIO "+state.general.folio : "";
}

/* ============================================================
   HELPERS DE UI
   ============================================================ */
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }

function bindInput(node, obj, key, after){
  node.value = obj[key] ?? "";
  node.addEventListener("input", ()=>{ obj[key]=node.value; if(after) after(); renderRail(); });
}

function navButtons(){
  return `
  <div class="nav">
    <button class="btn" id="btnPrev" ${current===0?"disabled":""}>← Anterior</button>
    <button class="btn primary" id="btnNext">${current===STEPS.length-1?"Ir a revisión":"Siguiente →"}</button>
  </div>`;
}
function wireNav(){
  document.getElementById("btnPrev").onclick = ()=>{ if(current>0){current--; renderAll();} };
  const nb = document.getElementById("btnNext");
  if(nb) nb.onclick = ()=>{ if(current<STEPS.length-1){current++; renderAll();} };
}

/* ============================================================
   PASO 1 — DATOS GENERALES
   ============================================================ */
function renderGeneral(){
  return `
  <div class="eyebrow">Sección 01</div>
  <h1>Datos generales</h1>
  <p class="sub">Identificación del incidente, la sede y quién reporta. Estos datos van directo al encabezado del informe final.</p>

  <div class="row2">
    <div class="field"><label>Folio</label><input id="f_folio" type="text" placeholder="INC-2026-0001"><div class="hint">Formato: INC-AAAA-NNNN</div></div>
    <div class="field"><label>Estado del informe</label>
      <select id="f_estado">
        ${["En investigación","En revisión","Aprobado","Cerrado"].map(o=>`<option ${state.general.estado===o?"selected":""}>${o}</option>`).join("")}
      </select>
    </div>
  </div>
  <div class="row2">
    <div class="field"><label>Fecha y hora del incidente</label><input id="f_fhi" type="datetime-local"></div>
    <div class="field"><label>Fecha y hora del reporte</label><input id="f_fhr" type="datetime-local"></div>
  </div>
  <div class="row3">
    <div class="field"><label>País</label><input id="f_pais" type="text"></div>
    <div class="field"><label>Ciudad</label><input id="f_ciudad" type="text"></div>
    <div class="field"><label>Sede / unidad / tienda</label><input id="f_sede" type="text" placeholder="Tienda Surquillo — Av. Angamos 1450"></div>
  </div>
  <div class="row2">
    <div class="field"><label>Cliente / operación</label><input id="f_cliente" type="text"></div>
    <div class="field"><label>Área específica del incidente</label><input id="f_area" type="text"></div>
  </div>
  <div class="row2">
    <div class="field"><label>Reportado por (nombre y cargo)</label><input id="f_reportadoPor" type="text"></div>
    <div class="field"><label>Teléfono / correo de quien reporta</label><input id="f_contacto" type="text"></div>
  </div>
  ${navButtons()}
  `;
}
function wireGeneral(){
  bindInput(document.getElementById("f_folio"), state.general, "folio");
  document.getElementById("f_fhi").value = state.general.fechaHoraIncidente;
  document.getElementById("f_fhi").oninput = e=>state.general.fechaHoraIncidente=e.target.value;
  document.getElementById("f_fhr").value = state.general.fechaHoraReporte;
  document.getElementById("f_fhr").oninput = e=>state.general.fechaHoraReporte=e.target.value;
  bindInput(document.getElementById("f_pais"), state.general, "pais");
  bindInput(document.getElementById("f_ciudad"), state.general, "ciudad");
  bindInput(document.getElementById("f_sede"), state.general, "sede", renderRail);
  bindInput(document.getElementById("f_cliente"), state.general, "cliente");
  bindInput(document.getElementById("f_area"), state.general, "area");
  bindInput(document.getElementById("f_reportadoPor"), state.general, "reportadoPor");
  bindInput(document.getElementById("f_contacto"), state.general, "contactoReportante");
  document.getElementById("f_estado").onchange = e=>state.general.estado=e.target.value;
  wireNav();
}

/* ============================================================
   PASO 2 — CLASIFICACIÓN
   ============================================================ */
function renderClasificacion(){
  const groups = Object.entries(state.clasificacion).map(([cat,items])=>`
    <fieldset>
      <legend>${cat}</legend>
      ${items.map(it=>{
        const key = cat+"|"+it;
        const checked = state.clasificacionSel[key] ? "checked":"";
        return `<label class="check"><input type="checkbox" data-key="${key}" ${checked}> ${it}</label>`;
      }).join("")}
    </fieldset>
  `).join("");
  return `
  <div class="eyebrow">Sección 02</div>
  <h1>Clasificación</h1>
  <p class="sub">Marca todas las categorías que apliquen. Si eliges "Otro", detállalo en la sección de Hechos.</p>
  ${groups}
  ${navButtons()}
  `;
}
function wireClasificacion(){
  document.querySelectorAll('[data-key]').forEach(cb=>{
    cb.onchange = ()=>{ state.clasificacionSel[cb.dataset.key] = cb.checked; renderRail(); };
  });
  wireNav();
}

/* ============================================================
   PASO 3 — SEVERIDAD
   ============================================================ */
function renderSeveridad(){
  const matrizRows = MATRIZ.map(r=>`<tr><td><span class="badge ${r[0]}">${r[0]}</span></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("");
  return `
  <div class="eyebrow">Sección 03</div>
  <h1>Severidad</h1>
  <p class="sub">La severidad es el nivel más alto alcanzado en cualquiera de las cuatro dimensiones. Usa la referencia de abajo si tienes dudas.</p>

  <div class="row2">
    <div class="field"><label>Nivel de severidad</label>
      <select id="s_nivel">
        <option value="">Selecciona…</option>
        ${["BAJA","MEDIA","ALTA","CRÍTICA"].map(o=>`<option ${state.severidad.nivel===o?"selected":""}>${o}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>Dimensión que define la severidad</label>
      <select id="s_dim">
        <option value="">Selecciona…</option>
        ${["Personas","Económico","Operacional","Reputacional y legal"].map(o=>`<option ${state.severidad.dimension===o?"selected":""}>${o}</option>`).join("")}
      </select>
    </div>
  </div>
  <div class="field"><label>Justificación de la severidad</label>
    <textarea id="s_just" placeholder="Explica en 2-3 líneas por qué corresponde este nivel."></textarea>
  </div>

  <fieldset>
    <legend>Referencia — matriz de severidad</legend>
    <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <thead><tr style="color:var(--text-dim);text-align:left;"><th style="padding:6px 8px;">Nivel</th><th style="padding:6px 8px;">Personas</th><th style="padding:6px 8px;">Económico</th><th style="padding:6px 8px;">Operacional</th><th style="padding:6px 8px;">Reputacional/legal</th></tr></thead>
      <tbody style="color:var(--text-dim);">${matrizRows}</tbody>
    </table>
    </div>
  </fieldset>

  ${navButtons()}
  `;
}
function wireSeveridad(){
  document.getElementById("s_nivel").onchange = e=>{state.severidad.nivel=e.target.value; renderRail();};
  document.getElementById("s_dim").onchange = e=>state.severidad.dimension=e.target.value;
  bindInput(document.getElementById("s_just"), state.severidad, "justificacion", renderRail);
  wireNav();
}

/* ============================================================
   PASO 4 — HECHOS
   ============================================================ */
function renderHechos(){
  const cronoRows = state.hechos.cronologia.map((c,i)=>`
    <div class="crono-row" data-i="${i}">
      <input type="text" class="crono-hora" placeholder="14:35" value="${c.hora||""}">
      <input type="text" class="crono-evento" placeholder="Qué ocurrió en ese momento" value="${(c.evento||"").replace(/"/g,'&quot;')}">
      <button type="button" class="repeat-remove crono-remove" title="Eliminar">✕</button>
    </div>
  `).join("");
  return `
  <div class="eyebrow">Sección 04</div>
  <h1>Hechos</h1>
  <p class="sub">Describe lo que se vio, no lo que se supone. No hace falta redactar bonito — el asistente corrige la redacción después; tú solo pon los hechos completos.</p>

async function generateReport(){
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-msg">Corrigiendo redacción y armando el informe…</div>
  </div>`;
  try{
    const res = await fetch("/api/generate-report", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(state)
    });
    const raw = await res.text();
    let data;
    try{ data = JSON.parse(raw); }
    catch(e){ throw new Error(`El servidor respondió algo que no es JSON (status ${res.status}). Revisa que la función esté desplegada y la URL /.netlify/functions/generate-report exista.`); }
    if(!res.ok){ throw new Error(data.error + (data.detail ? " — Detalle: " + (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)) : " — Respuesta completa: " + JSON.stringify(data))); }
    report = data;
  }catch(err){
    report = null;
    renderAll();
    const box = document.getElementById("genError");
    if(box) box.innerHTML = `<div class="error-box">No se pudo generar el informe: ${String(err.message||err)}. Revisa que la función de Netlify tenga configurada la variable ANTHROPIC_API_KEY.</div>`;
    return;
  }
  renderAll();
}

    ${acr.factor_proceso?`<p><strong>Factor de proceso:</strong> ${acr.factor_proceso}</p>`:""}
    ${acr.factor_humano?`<p><strong>Factor humano:</strong> ${acr.factor_humano}</p>`:""}
    ${acr.hipotesis?`<p><strong>Hipótesis en verificación:</strong> ${acr.hipotesis}</p>`:""}

    <h3>07 · Conclusiones</h3>
    <ul>${conclusiones}</ul>

    <h3>08 · Recomendaciones</h3>
    <ul>${recomendaciones}</ul>

    <h3>09 · Plan de acción</h3>
    <table><thead><tr><th>Acción</th><th>Tipo</th><th>Responsable</th><th>Compromiso</th><th>Estado</th></tr></thead><tbody>${planRows}</tbody></table>

    <h3>10 · Notificaciones</h3>
    <table>
      <tbody>
        <tr><th>Policía</th><td>${state.notificaciones.policia}</td><th>N° denuncia</th><td>${state.notificaciones.numDenuncia||"—"}</td></tr>
        <tr><th>Fiscalía</th><td>${state.notificaciones.fiscalia}</td><th>Comisaría</th><td>${state.notificaciones.comisaria||"—"}</td></tr>
        <tr><th>Aseguradora</th><td>${state.notificaciones.aseguradora}</td><th>Fecha denuncia</th><td>${state.notificaciones.fechaDenuncia||"—"}</td></tr>
        <tr><th>Cliente</th><td>${state.notificaciones.cliente}</td><th>Gerencia ISEG</th><td>${state.notificaciones.gerenciaISEG}</td></tr>
      </tbody>
    </table>

    <p style="margin-top:24px;color:#888;font-size:11.5px;">Este informe fue generado con asistencia de IA a partir de la captura del líder operativo. Requiere revisión y aprobación antes de enviarse al cliente.</p>
  </div>
  `;
}

/* ---------- descarga PDF (vía impresión del navegador) ---------- */
function downloadPdf(){ window.print(); }

/* ---------- descarga Word (.docx) ---------- */
async function downloadWord(){
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType } = docx;

  const h = (text)=> new Paragraph({ text, heading: HeadingLevel.HEADING_2, spacing:{before:280, after:120} });
  const p = (text)=> new Paragraph({ children:[new TextRun(text||"—")], spacing:{after:120} });
  const bullet = (text)=> new Paragraph({ text, bullet:{level:0}, spacing:{after:60} });

  const mkTable = (headerCells, rows)=> new Table({
    width:{size:100, type:WidthType.PERCENTAGE},
    rows:[
      new TableRow({children: headerCells.map(t=>new TableCell({children:[new Paragraph({children:[new TextRun({text:t,bold:true})]})]}))}),
      ...rows.map(r=> new TableRow({children: r.map(c=>new TableCell({children:[new Paragraph(String(c||"—"))]}))}))
    ]
  });

  const clasifSel = Object.entries(state.clasificacionSel).filter(([k,v])=>v).map(([k])=>k.split("|")[1]);
  const cronologia = report.cronologia||state.hechos.cronologia;
  const acr = report.analisis_causa_raiz||{};

  const children = [
    new Paragraph({ children:[new TextRun({text:"ISEG CORP · INFORME DE INCIDENCIA · CONFIDENCIAL", size:18, color:"8a6d2f"})] }),
    new Paragraph({ children:[new TextRun({text:`Folio ${state.general.folio||"—"} · Severidad ${fmtSeveridad()}`, bold:true, size:32})], spacing:{after:60} }),
    new Paragraph({ children:[new TextRun({text:`${state.general.cliente||"—"} · ${state.general.sede||"—"}`, size:20, color:"555555"})], spacing:{after:240} }),

    h("01 · Resumen ejecutivo"), p(report.resumen_ejecutivo),
    h("02 · Clasificación y severidad"),
    p("Categorías: " + (clasifSel.length?clasifSel.join(", "):"—")),
    p(`Severidad: ${fmtSeveridad()} (${state.severidad.dimension||"—"}) — ${report.severidad_justificacion||state.severidad.justificacion||""}`),

    h("03 · Hechos"),
    ...(report.hechos_narrativa||"").split("\n\n").map(p),
    mkTable(["Hora","Evento","Fuente"], cronologia.map(c=>[c.hora,c.evento,c.fuente||""])),
    p("Detección: " + (report.deteccion||state.hechos.deteccion||"—")),

    h("04 · Personas involucradas"),
    mkTable(["Nombre","Rol","Documento","Observaciones"], state.personas.map(pp=>[pp.nombre,pp.rol,pp.documento,pp.observaciones])),

    h("05 · Impacto"),
    mkTable(["Concepto","Valor"], [
      ["Valor de activos", `${state.impacto.moneda} ${state.impacto.valorActivos||"0"}`],
      ["Valor recuperado", `${state.impacto.moneda} ${state.impacto.valorRecuperado||"0"}`],
      ["Pérdida neta", `${state.impacto.moneda} ${((parseFloat(state.impacto.valorActivos)||0)-(parseFloat(state.impacto.valorRecuperado)||0)).toFixed(2)}`],
      ["Base de cálculo", state.impacto.baseCalculo||"—"],
    ]),

    h("06 · Análisis de causa raíz"),
    ...[acr.factor_tecnologico && p("Factor tecnológico: "+acr.factor_tecnologico),
        acr.factor_proceso && p("Factor de proceso: "+acr.factor_proceso),
        acr.factor_humano && p("Factor humano: "+acr.factor_humano),
        acr.hipotesis && p("Hipótesis en verificación: "+acr.hipotesis)].filter(Boolean),

    h("07 · Conclusiones"),
    ...(report.conclusiones||[]).map(bullet),

    h("08 · Recomendaciones"),
    ...(report.recomendaciones||[]).map(r=>bullet(`${r.prioridad} — ${r.texto}`)),

    h("09 · Plan de acción"),
    mkTable(["Acción","Tipo","Responsable","Compromiso","Estado"], state.planAccion.map(a=>[a.accion,a.tipo,a.responsable,a.fecha,a.estado])),

    h("10 · Notificaciones"),
    mkTable(["Notificación","Estado"], [
      ["Policía", state.notificaciones.policia],
      ["Fiscalía / MP", state.notificaciones.fiscalia],
      ["Aseguradora", state.notificaciones.aseguradora],
      ["Cliente", state.notificaciones.cliente],
      ["Gerencia ISEG", state.notificaciones.gerenciaISEG],
      ["N° de denuncia", state.notificaciones.numDenuncia||"—"],
      ["Comisaría", state.notificaciones.comisaria||"—"],
      ["Fecha de denuncia", state.notificaciones.fechaDenuncia||"—"],
    ]),
  ];

  const doc = new Document({ sections:[{ children }] });
  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Informe_${state.general.folio||"incidencia"}.docx`;
  a.click();
  URL.revokeObjectURL(url);
}

function wireRevision(){
  if(report){
    document.getElementById("btnPdf").onclick = downloadPdf;
    document.getElementById("btnWord").onclick = downloadWord;
    document.getElementById("btnRegenerate").onclick = ()=>{ report=null; generateReport(); };
    document.getElementById("btnEdit").onclick = ()=>{ report=null; current=0; renderAll(); };
    return;
  }
  document.getElementById("btnPrev").onclick = ()=>{ current--; renderAll(); };
  document.getElementById("btnGenerate").onclick = generateReport;
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
const WIRES = {
  general: wireGeneral, clasificacion: wireClasificacion, severidad: wireSeveridad,
  hechos: wireHechos, impacto: wireImpacto, notificaciones: wireNotificaciones,
  acciones: wireAcciones, personas: wirePersonas, evidencias: wireEvidencias,
  plan: wirePlan, revision: wireRevision
};

function renderAll(){
  const main = document.getElementById("main");
  const step = STEPS[current];
  main.innerHTML = `<div class="panel active">${step.render()}</div>`;
  WIRES[step.id]();
  renderRail();
  window.scrollTo({top:0, behavior:"instant"});
}

renderAll();
</script>
